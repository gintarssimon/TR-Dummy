:root {
  --bg: #000;
  --fg: #fff;
  --muted: #6f6f74;
  --dim: #55555a;
  --card: #121213;
  --raise: #1c1c1e;
  --green: #05d05a;
  --red: #ff4234;
  --purple: #5b2cf5;
  --blue: #0a5cff;
  --pad: 30px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
  --font: "Inter", -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; background: #0a0a0b; color: var(--fg); overscroll-behavior: none; }
body { font-family: var(--font); font-feature-settings: "calt", "ss03"; letter-spacing: -.011em; font-size: 16px; line-height: 1.25; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; -webkit-text-size-adjust: 100%; user-select: none; -webkit-user-select: none; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; text-align: left; touch-action: manipulation; }
button:disabled { cursor: default; }
input { font: inherit; color: inherit; user-select: text; -webkit-user-select: text; }
svg { display: block; }
h1, h2 { font-size: inherit; font-weight: 700; }
i, em { font-style: normal; }
[hidden] { display: none !important; }

/* ---------- Bühne & Geräterahmen ---------- */

#stage { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 24px 0; background: radial-gradient(90% 70% at 50% 0%, #17171a 0%, #0a0a0b 60%); }
#phone { position: relative; width: 393px; height: min(852px, calc(100vh - 86px)); height: min(852px, calc(100dvh - 86px)); background: var(--bg); border-radius: 50px; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 0 0 2px #2b2b2e, 0 0 0 11px #0e0e10, 0 0 0 12px #303034, 0 40px 90px rgba(0, 0, 0, .7); }
#statusbar { flex: none; height: 47px; display: flex; align-items: center; justify-content: space-between; padding: 6px 30px 0 38px; font-weight: 700; font-size: 15px; letter-spacing: -.01em; }
.sb-right { display: flex; align-items: center; gap: 6px; }
.sb-bat { width: 25px; height: 12px; border-radius: 4px; background: rgba(255, 255, 255, .35); overflow: hidden; }
.sb-bat i { display: block; width: 62%; height: 100%; background: #fff; border-radius: 3px; }
#app { position: relative; flex: 1; min-height: 0; overflow: hidden; background: var(--bg); container-type: inline-size; }
@supports (width: 1cqw) { #main, #sheets, #toast { --pad: clamp(26px, 7.800cqw, 36px); } }
#homebar { position: absolute; left: 50%; bottom: 8px; width: 136px; height: 5px; margin-left: -68px; border-radius: 3px; background: #fff; z-index: 60; pointer-events: none; }
#note { color: #6c6c72; font-size: 13px; font-weight: 500; }
#note b { color: #a1a1a6; font-weight: 600; }

@media (max-width: 520px), (max-height: 560px) {
  #stage { padding: 0; display: block; height: 100%; }
  #phone { width: 100%; height: 100vh; height: 100dvh; border-radius: 0; box-shadow: none; padding-top: var(--safe-t); }
  #statusbar, #homebar, #note { display: none; }
}
@media (min-width: 521px) and (min-height: 561px) {
  :root { --safe-b: 14px; }
}

/* ---------- Ladescreen & Wortmarke ---------- */

#splash { position: absolute; inset: 0; z-index: 80; display: grid; place-items: center; background: #000; transition: opacity .55s ease, visibility 0s linear .55s; }
#splash.out { opacity: 0; visibility: hidden; }
#splash .tr-logo { animation: splashIn .7s cubic-bezier(.2, .8, .2, 1) both; transition: transform .6s cubic-bezier(.32, .72, 0, 1); }
#splash.out .tr-logo { transform: scale(1.06); }
@keyframes splashIn { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: none; } }
.tr-logo { display: inline-flex; align-items: center; gap: 6px; color: #fff; font-size: 16px; line-height: 1; white-space: nowrap; }
.tr-logo b { font-weight: 850; letter-spacing: .012em; }
.tr-mark { width: 19px; height: 15px; }
#main, #sheets { opacity: 0; }
#app.ready #main, #app.ready #sheets { opacity: 1; }
#app.ready #main { animation: appIn .7s cubic-bezier(.32, .72, 0, 1); }
@keyframes appIn { from { opacity: 0; transform: scale(.97); } to { opacity: 1; transform: none; } }

/* ---------- Kopf & Hauptansicht ---------- */

#main { position: absolute; inset: 0; transform-origin: 50% 38%; transition: transform .52s cubic-bezier(.32, .72, 0, 1), opacity .52s cubic-bezier(.32, .72, 0, 1); will-change: transform; }
#main.behind { transform: scale(.93); opacity: .38; }
.top { position: absolute; top: 0; left: 0; right: 0; height: 64px; z-index: 5; display: flex; align-items: center; justify-content: space-between; padding: 0 var(--pad); background: var(--bg); }
.tabs { display: flex; gap: 14px; }
.tab { font-size: 21px; font-weight: 700; letter-spacing: -.015em; color: #5e5e63; transition: color .35s ease; }
.tab.on { color: var(--fg); }
.avatar { width: 30px; height: 30px; border-radius: 50%; background: #4a4a4f; color: #000; font-size: 13px; font-weight: 800; text-align: center; transition: background .35s ease, transform .3s cubic-bezier(.2, .8, .2, 1); }
.avatar.on { background: #fff; }
.avatar:active { transform: scale(.9); }

#viewwrap { position: absolute; top: 64px; left: 0; right: 0; bottom: 0; overflow: hidden; }
.view { position: absolute; inset: 0; background: var(--bg); will-change: transform, opacity; overflow-y: auto; overflow-x: hidden; padding-bottom: calc(120px + var(--safe-b)); scrollbar-width: none; overscroll-behavior: contain; }
.view::-webkit-scrollbar, .sheet-scroll::-webkit-scrollbar, .cards::-webkit-scrollbar, .chips::-webkit-scrollbar, .months::-webkit-scrollbar, .ipos::-webkit-scrollbar, .bubbles::-webkit-scrollbar { display: none; }

.hero { padding: 24px var(--pad) 0; }
.hero-label { display: flex; width: 100%; align-items: center; justify-content: space-between; color: var(--muted); font-size: 16px; font-weight: 600; line-height: 20px; }
.hero-chev { color: #6a6a6f; }
.hero-chev svg { width: 24px; height: 24px; stroke-width: 3.800; }
.hero-chev.flip svg { transform: rotate(180deg); }
.hero-line { display: flex; align-items: baseline; gap: 13px; margin-top: 5px; min-height: 28px; }
.hero-line.pad { padding: 0 var(--pad); margin-top: 8px; }
.hero-amount { font-size: 22px; font-weight: 700; letter-spacing: -.02em; line-height: 28px; font-variant-numeric: tabular-nums; }
.hero-delta { font-size: 15.500px; font-weight: 700; white-space: nowrap; }
.hero-delta.acc { color: var(--acc); }
.hero-date, .hero-note { font-size: 14px; font-weight: 600; color: var(--muted); white-space: nowrap; }
.hero-date:empty { display: none; }
.view-ghost { pointer-events: none; }
.view-ghost .chart svg, .view-ghost .m-in { animation: none; }

.tri { display: inline-block; width: 0; height: 0; margin-right: 5px; border-left: 4.5px solid transparent; border-right: 4.5px solid transparent; vertical-align: 1px; }
.tri.up { border-bottom: 8px solid currentColor; }
.tri.down { border-top: 8px solid currentColor; }
.chg { position: relative; display: inline-block; font-weight: 700; font-size: 16px; white-space: nowrap; font-variant-numeric: tabular-nums; cursor: pointer; }
/* größere Tippfläche für den Wechsel Prozent ↔ € */
.chg::after, .hero-delta[data-a]::after { content: ''; position: absolute; inset: -14px -10px -14px -14px; }
.hero-delta[data-a] { position: relative; cursor: pointer; }
.chg.up, .green { color: var(--green); }
.chg.down { color: var(--red); }

.tf { display: flex; padding: 36px var(--pad) 0; }
.tf button { width: 57px; font-size: 15px; font-weight: 600; color: var(--muted); line-height: 20px; transition: color .35s ease; }
.tf button.on { color: var(--acc, var(--fg)); }

.chart { position: relative; height: 240px; margin-top: 20px; touch-action: pan-y; cursor: crosshair; }
.chart svg { width: 100%; height: 100%; overflow: visible; animation: reveal 1.1s cubic-bezier(.3, .6, .2, 1) both; }
@keyframes reveal { from { clip-path: inset(-14px 100% -14px -14px); } to { clip-path: inset(-14px -14px -14px -14px); } }
.ch-line { fill: none; stroke: var(--acc, #fff); stroke-width: 3.200; stroke-linejoin: round; stroke-linecap: round; }
.ch-base { fill: none; stroke: #4a4a4f; stroke-width: 2.4; stroke-dasharray: .1 7.5; stroke-linecap: round; }
.ch-cursor { position: absolute; top: 0; bottom: 0; width: 0; border-left: 1px solid #55555a; pointer-events: none; }
.ch-cursor i { position: absolute; left: -6px; width: 11px; height: 11px; margin-top: -5.500px; border-radius: 50%; background: var(--acc, #fff); box-shadow: 0 0 0 4px rgba(0, 0, 0, .9); }

/* ---------- Karten-Reihe ---------- */

.cards { display: flex; gap: 8px; margin-top: 34px; padding: 0 var(--pad); overflow-x: auto; scrollbar-width: none; scroll-padding: 0 var(--pad); scroll-snap-type: x proximity; }
.card { position: relative; flex: none; width: 146px; height: 78px; padding: 14px 16px; border-radius: 16px; background: var(--card); display: flex; flex-direction: column; gap: 7px; scroll-snap-align: start; }
.cards.tall .card { height: 116px; padding-top: 17px; gap: 9px; }
.card-l { color: var(--muted); font-size: 16px; font-weight: 600; line-height: 20px; }
.card-v { font-size: 15px; font-weight: 700; line-height: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-foot { margin-top: auto; font-size: 13px; font-weight: 600; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-plus { display: grid; place-items: center; width: 17px; height: 17px; border-radius: 50%; background: #4a4a4f; color: #000; }
.card-plus svg { width: 11px; height: 11px; stroke-width: 3.6; }
.card-pie { width: 19px; height: 19px; border-radius: 50%; background: conic-gradient(#0a5cff 0 62%, #0a2f8f 62% 80%, #2b7bff 80%); -webkit-mask: radial-gradient(circle, transparent 3px, #000 3.500px); mask: radial-gradient(circle, transparent 3px, #000 3.500px); }
.mini-card { width: 20px; height: 14px; margin-top: 2px; border-radius: 2.500px; background: linear-gradient(135deg, #b9b9bd, #77777b); position: relative; }
.mini-card::after { content: ''; position: absolute; left: 3px; top: 4px; width: 4px; height: 3px; border-radius: 1px; background: rgba(0, 0, 0, .35); }
.mini-card.off { background: #3a3a3e; }
.card-dots { position: relative; width: 22px; height: 20px; }
.card-dots b { position: absolute; border-radius: 50%; }
.card-dots b:nth-child(1) { left: 0; top: 0; width: 12px; height: 12px; background: #0a3bff; }
.card-dots b:nth-child(2) { left: 13px; top: 5px; width: 7px; height: 7px; background: var(--green); }
.card-dots b:nth-child(3) { left: 7px; top: 12px; width: 8px; height: 8px; background: #7a3ff0; }
.card-acct { display: flex; align-items: center; }
.card-acct b { width: 22px; height: 22px; border-radius: 50%; background: #fff; color: #000; font-size: 11px; font-weight: 800; display: grid; place-items: center; z-index: 1; }
.card-acct em { width: 22px; height: 22px; margin-left: -5px; border-radius: 50%; background: #2a2a2d; color: #6c6c72; display: grid; place-items: center; }
.card-acct em svg { width: 11px; height: 11px; stroke-width: 3.4; }
.card-mail { width: 22px; height: 22px; border-radius: 50%; background: #4a4a4f; color: #000; display: grid; place-items: center; }
.card-mail svg { width: 13px; height: 13px; }
.cards.movers { margin-top: 0; }
.cards.movers .card { height: 116px; gap: 0; justify-content: flex-end; }
.cards.movers .ins-ic { position: absolute; top: 16px; left: 16px; }
.cards.movers .card-v { font-size: 16px; margin-bottom: 6px; }

/* ---------- Abschnitte & Zeilen ---------- */

.sec { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 43px var(--pad) 12px; }
.sec h2 { font-size: 16px; line-height: 20px; }
.sec-btn { display: flex; align-items: center; gap: 5px; color: var(--muted); font-size: 16px; font-weight: 600; }
.sec-btn svg { width: 13px; height: 13px; }
.sec-link { display: flex; align-items: center; gap: 9px; }
.sec-link svg { width: 12px; height: 12px; color: #77777c; }
.sec-link.back svg { color: #fff; }

.row { display: flex; align-items: center; width: 100%; min-height: 73px; padding: 6px var(--pad); }
.row.slim { min-height: 50px; padding-top: 2px; padding-bottom: 2px; }
button.row, .card, .pill, .chip, .picker, .ipo, .promo, .intro, .fab, .cta, .sq, .star, .sec-btn, .sec-link, .hero-label { transition: opacity .45s ease, transform .45s cubic-bezier(.2, .8, .2, 1), background .3s ease, color .3s ease; }
button.row:active, .picker:active, .sec-btn:active, button.sec-link:active, button.hero-label:active { opacity: .5; transition-duration: .08s; }
.card:active, .pill:active, .chip:active, .ipo:active, .promo:active, .intro:active, .fab:active, .cta:active, .sq:active, .star:active { opacity: .7; transform: scale(.965); transition-duration: .08s; }
.m-in { animation: mIn .46s cubic-bezier(.2, .8, .2, 1) both; }
@keyframes mIn { from { opacity: 0; transform: translateY(-14px); } to { opacity: 1; transform: none; } }
.row-ic { flex: none; width: 52px; display: flex; align-items: center; }
.row-ic:has(.ins-ic), .row-ic:has(.dot) { width: 44px; }
.row-ic.tx { width: 52px; }
.row-ic.tx .ins-ic { margin-left: 3px; }
.row-ic.nav { width: 44px; }
.row-ic.nav .tx-ic { margin-left: 0; }
.row-ic.ev { width: 52px; }
.row-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px; }
.row-main b { font-size: 16px; line-height: 20px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row-main small { font-size: 13.500px; line-height: 18px; font-weight: 500; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row-end { flex: none; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; padding-left: 14px; text-align: right; }
.row-end b { font-size: 16px; line-height: 20px; font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; }
.row-end small { font-size: 14px; line-height: 18px; font-weight: 500; color: var(--muted); white-space: nowrap; }
.row-end.split { flex-direction: row; align-items: center; gap: 10px; }
.row.blue .row-main b, .row.blue .row-main small { color: var(--blue); }
.row.blue .row-main small { opacity: .9; }
.row.danger .row-main b { color: var(--red); }
.strike { text-decoration: line-through; text-decoration-thickness: 2px; color: #8a8a8f; }
.muted { color: var(--muted); }
.mono { font-variant-numeric: tabular-nums; letter-spacing: .01em; }
.gold { color: #b9a98c; }
.gold-dim { color: #6f6553 !important; }
.gold-badge { width: 19px; height: 19px; border-radius: 50%; background: #c9bda6; color: #000; display: grid; place-items: center; }
.gold-badge svg { width: 11px; height: 11px; stroke-width: 3.6; }

.ins-ic { flex: none; width: 20px; height: 20px; border-radius: 4.500px; display: grid; place-items: center; overflow: hidden; }
.ins-ic i { font-weight: 800; letter-spacing: -.04em; line-height: 1; }
.ins-ic.lg { width: 44px; height: 44px; border-radius: 11px; }
.ins-ic.lg i { transform: scale(2); }
.ins-ic.logo svg { width: 14px; height: 14px; }
.ins-ic.md { width: 28px; height: 28px; border-radius: 6px; }
.ins-ic.md i { transform: scale(1.350); }
.ins-ic.md.logo svg { width: 21px; height: 21px; }
.ins-ic.lg.logo svg { width: 30px; height: 30px; }
.tx-ic { position: relative; flex: none; width: 20px; height: 20px; margin-left: 3.500px; border-radius: 50%; background: #fff; color: #000; display: grid; place-items: center; }
.tx-ic svg { width: 13.500px; height: 13.500px; }
.tx-ic.acc svg { width: 12.500px; height: 12.500px; stroke-width: 2.500; }
.tx-ic .av-eur { font-size: 12px; font-weight: 800; line-height: 1; }
.tx-ic.big { width: 60px; height: 60px; margin: 0; }
.tx-ic.big svg { width: 30px; height: 30px; stroke-width: 2.100; }
.tx-ic.big .av-eur { font-size: 28px; }
.tx-ic.pct { background: #5a2be6; color: #fff; font-size: 11px; font-weight: 800; }
.tx-ic.logo svg { width: 13px; height: 13px; }
.tx-ic.blue { background: var(--blue); color: #fff; }
.tx-ic.red { background: var(--red); color: #fff; }
.tx-ic.num { font-size: 12px; font-weight: 800; }
.tx-ic.ghost { background: none; color: #fff; }
.tx-ic.ghost svg { width: 20px; height: 20px; }
.tx-ic.ghost em { position: absolute; right: -9px; bottom: -8px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: #1e1e21; box-shadow: 0 0 0 2px #000; font-size: 10px; font-weight: 700; display: grid; place-items: center; }
.tx-av { flex: none; width: 28px; height: 28px; border-radius: 50%; background: #1c1c1f; color: #6a6a6f; font-size: 11px; font-weight: 700; display: grid; place-items: center; }
.dot { width: 16px; height: 16px; margin-left: 2px; border-radius: 50%; }
.ring { width: 20px; height: 20px; }
.ring-arc { transition: stroke-dasharray .7s cubic-bezier(.3, .7, .2, 1), opacity .3s ease; }

.legal { margin-top: 38px; padding: 0 var(--pad); font-size: 13px; line-height: 1.62; font-weight: 600; color: #5f5f64; text-align: justify; }
.legal b { color: #fff; font-weight: 700; }
.empty { padding: 14px var(--pad); color: var(--muted); font-size: 15px; font-weight: 500; line-height: 1.5; }
.empty-box { margin: 4px var(--pad) 0; padding: 22px; border-radius: 18px; background: var(--card); display: flex; flex-direction: column; align-items: flex-start; gap: 8px; }
.empty-box b { font-size: 16px; }
.empty-box span { color: var(--muted); font-size: 14px; font-weight: 500; line-height: 1.5; }
.empty-box .chip { margin-top: 8px; }

.intro { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; width: calc(100% - 2 * var(--pad)); margin: 12px var(--pad) 0; padding: 20px; border-radius: 18px; background: var(--card); }
.intro b { font-size: 19px; }
.intro span { color: var(--muted); font-size: 14px; font-weight: 500; line-height: 1.5; }
.intro-tag, .badge { display: inline-block; padding: 2px 7px; border-radius: 6px; background: var(--purple); color: #fff; font-size: 11px; font-weight: 700; letter-spacing: .02em; text-transform: uppercase; vertical-align: 2px; }
.intro-cta { display: flex; align-items: center; gap: 6px; margin-top: 6px; font-size: 15px; font-weight: 700; }
.intro-cta svg { width: 11px; height: 11px; }

.goal { margin-top: 16px; }
.sheet .goal { padding: 0 var(--pad); }
.goal-track { height: 6px; border-radius: 3px; background: #1f1f22; overflow: hidden; }
.goal-track i { display: block; height: 100%; border-radius: 3px; background: #fff; transition: width .5s cubic-bezier(.2, .8, .2, 1); }
.goal-meta { display: flex; justify-content: space-between; margin-top: 9px; color: var(--muted); font-size: 13px; font-weight: 600; }

/* ---------- Promo-Karten (leere Depots) ---------- */

.promo { position: relative; display: block; width: calc(100% - 2 * var(--pad)); height: 430px; margin: 34px var(--pad) 0; border-radius: 24px; overflow: hidden; }
.promo + .cards { margin-top: 8px; }
.promo-art { position: absolute; inset: 0; }
.promo-art::before, .promo-art::after { content: ''; position: absolute; border-radius: 50%; }
.art-pm .promo-art { background: radial-gradient(120% 90% at 78% 22%, #6a5645 0%, #33271f 42%, #0c0a09 100%); }
.art-pm .promo-art::before { width: 230px; height: 230px; right: -50px; top: 40px; background: radial-gradient(circle at 35% 30%, #a98f73, #3b2d22 70%); opacity: .7; }
.art-pm .promo-art::after { width: 120px; height: 120px; left: 30px; top: 120px; background: radial-gradient(circle at 40% 30%, #57493c, #1a1410 75%); opacity: .8; }
.art-bonds .promo-art { background: radial-gradient(120% 90% at 30% 15%, #7a9a48 0%, #33521f 45%, #0b1708 100%); }
.art-bonds .promo-art::before { width: 250px; height: 250px; left: 44px; top: 30px; background: radial-gradient(circle at 40% 30%, #e8e6d6, #9fa586 60%, #4c5c38); opacity: .85; }
.art-bonds .promo-art::after { width: 90px; height: 90px; right: 20px; top: 200px; background: radial-gradient(circle at 40% 30%, #ffb648, #a55a12); opacity: .8; }
.art-crypto .promo-art { background: linear-gradient(160deg, #a2603b 0%, #5d3625 48%, #170f0b 100%); }
.art-crypto .promo-art::before { width: 210px; height: 210px; left: 60px; top: 50px; background: radial-gradient(circle at 38% 30%, #ffd08a, #f7931a 55%, #7a3d05); opacity: .9; }
.art-crypto .promo-art::after { width: 100px; height: 100px; right: 30px; top: 30px; background: radial-gradient(circle at 40% 30%, #3f6b3a, #16300f); opacity: .8; }
.promo-txt { position: absolute; left: 0; right: 0; bottom: 0; padding: 90px 30px 30px; display: flex; flex-direction: column; gap: 10px; background: linear-gradient(to top, rgba(0, 0, 0, .86) 35%, transparent); }
.promo-txt b { display: flex; align-items: center; gap: 10px; font-size: 18px; line-height: 23px; }
.promo-txt b svg { flex: none; width: 12px; height: 12px; }
.promo-txt span { color: rgba(255, 255, 255, .72); font-size: 15.500px; font-weight: 600; line-height: 1.55; }

/* ---------- Untere Leiste ---------- */

.bottombar { position: absolute; left: 0; right: 0; bottom: 0; z-index: 6; display: flex; gap: 8px; padding: 26px var(--pad) calc(12px + var(--safe-b)); background: linear-gradient(to top, #000 52%, rgba(0, 0, 0, 0)); pointer-events: none; }
.bottombar.inl { position: static; padding: 0; background: none; }
.pill { pointer-events: auto; flex: 1; height: 53px; padding: 0 17px; border-radius: 15px; background: #fff; color: #000; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: space-between; }
.pill svg { width: 20px; height: 20px; }
.pill.dark { background: #222225; color: #fff; }

/* ---------- Sheets ---------- */

#sheets { position: absolute; inset: 0; z-index: 20; pointer-events: none; }

/* ---------- Zufall (seeded) ---------- */

function mulberry32(a) {
  return function () {
    a |= 0;
    a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function hashStr(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) {
    h ^= s.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}

function makeRand(seed) {
  const r = mulberry32(seed);
  const R = {
    raw: r,
    f: (min, max) => min + r() * (max - min),
    i: (min, max) => Math.floor(min + r() * (max - min + 1)),
    pick: (arr) => arr[Math.floor(r() * arr.length)],
    chance: (p) => r() < p,
    shuffle: (arr) => {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(r() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    },
    sample: (arr, n) => R.shuffle(arr).slice(0, n),
    money: (min, max) => Math.round(R.f(min, max) * 100) / 100,
    normal: () => {
      let u = 0;
      let v = 0;
      while (u === 0) u = r();
      while (v === 0) v = r();
      return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
    },
  };
  return R;
}

/* ---------- Datum ---------- */

const DAY = 864e5;
const MON_SHORT = ['Jan.', 'Feb.', 'März', 'Apr.', 'Mai', 'Juni', 'Juli', 'Aug.', 'Sept.', 'Okt.', 'Nov.', 'Dez.'];
const MON_LONG = ['Januar', 'Februar', 'März', 'April', 'Mai', 'Juni', 'Juli', 'August', 'September', 'Oktober', 'November', 'Dezember'];

function startOfDay(ts) {
  const d = new Date(ts);
  d.setHours(0, 0, 0, 0);
  return +d;
}
const dayShort = (ts) => {
  const d = new Date(ts);
  return d.getDate() + '. ' + MON_SHORT[d.getMonth()];
};
const dayLong = (ts) => {
  const d = new Date(ts);
  return d.getDate() + '. ' + MON_LONG[d.getMonth()] + ' ' + d.getFullYear();
};
const timeShort = (ts) => {
  const d = new Date(ts);
  return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
};
const monthKey = (ts) => {
  const d = new Date(ts);
  return d.getFullYear() * 12 + d.getMonth();
};
function monthGroupLabel(ts, now) {
  const diff = monthKey(now) - monthKey(ts);
  if (diff === 0) return 'Dieser Monat';
  if (diff === 1) return 'Letzter Monat';
  const d = new Date(ts);
  const sameYear = d.getFullYear() === new Date(now).getFullYear();
  return MON_LONG[d.getMonth()] + (sameYear ? '' : ' ' + d.getFullYear());
}
/** Nächster Termin für einen Tag-im-Monat (frühestens morgen). */
function nextDayOfMonth(day, now) {
  const today = new Date(startOfDay(now));
  let d = new Date(today.getFullYear(), today.getMonth(), Math.min(day, 28));
  if (+d <= +today) d = new Date(today.getFullYear(), today.getMonth() + 1, Math.min(day, 28));
  return +d;
}
function inDaysLabel(ts, now) {
  const n = Math.round((startOfDay(ts) - startOfDay(now)) / DAY);
  if (n <= 0) return 'Heute';
  if (n === 1) return 'Morgen';
  return 'In ' + n + ' Tagen';
}

/* ---------- IBAN ---------- */

function makeIban(R) {
  const bban = '100' + String(R.i(10000, 99999)) + String(R.i(1000000000, 9999999999));
  const check = 98n - (BigInt(bban + '131400') % 97n);
  return 'DE' + String(check).padStart(2, '0') + bban;
}
const ibanPretty = (iban) => iban.replace(/(.{4})/g, '$1 ').trim();
const ibanTail = (iban) => '··· ' + iban.slice(-4);

/* ---------- Marken-Logos (Daten in logos.js) ---------- */

/**
 * Kachelfarben zu einem Logo: das Zeichen steht in Markenfarbe auf weißer Kachel – so bleibt jede Form
 * (auch vollflächige Signets wie Kreise oder Badges) originalgetreu. Sehr helle Marken bekommen eine dunkle Kachel.
 */
function logoColors(slug) {
  const hex = LOGOS[slug][0];
  const r = parseInt(hex.slice(0, 2), 16);
  const g = parseInt(hex.slice(2, 4), 16);
  const b = parseInt(hex.slice(4, 6), 16);
  const lum = (0.2126 * r + 0.7152 * g + 0.0722 * b) / 255;
  if (LOGO_ON_BRAND.includes(slug)) return ['#' + hex, lum > 0.7 ? '#000000' : '#ffffff'];
  return lum > 0.7 ? ['#1d1d21', '#' + hex] : ['#ffffff', '#' + hex];
}
/** Wortmarken, die im Original weiß auf der Markenfarbe stehen. */
const LOGO_ON_BRAND = ['goldmansachs', 'adyen'];
const logoUse = (slug) => `<svg viewBox="0 0 24 24" fill="currentColor" stroke="none" aria-hidden="true"><use href="#lg-${slug}"/></svg>`;
/** Alle Logos einmal als SVG-Symbole ins Dokument legen, Zeilen verweisen nur per <use> darauf. */
function mountLogoSprite() {
  const symbols = Object.keys(LOGOS).map((k) => `<symbol id="lg-${k}" viewBox="0 0 24 24"><path d="${LOGOS[k][1]}"/></symbol>`).join('');
  document.body.insertAdjacentHTML('afterbegin', `<svg aria-hidden="true" style="position:absolute;width:0;height:0;overflow:hidden">${symbols}</svg>`);
}

/* ---------- Akzentfarbe je Wertpapier (aus der Markenfarbe) ---------- */

function linLum(rgb) {
  const f = (c) => {
    c /= 255;
    return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
  };
  return 0.2126 * f(rgb[0]) + 0.7152 * f(rgb[1]) + 0.0722 * f(rgb[2]);
}
/** Liefert [Akzent, Schriftfarbe darauf]. Neutrale Marken (Schwarz/Weiß/Grau) und Titel ohne Logo bleiben weiß. */
function accentFor(ins) {
  if (!ins.logo || !LOGOS[ins.logo]) return ['#ffffff', '#000000'];
  const hex = LOGOS[ins.logo][0];
  let rgb = [0, 2, 4].map((i) => parseInt(hex.slice(i, i + 2), 16));
  if (Math.max.apply(null, rgb) - Math.min.apply(null, rgb) < 40) return ['#ffffff', '#000000'];
  for (let i = 0; i < 20 && linLum(rgb) < 0.17; i++) rgb = rgb.map((c) => Math.round(c + (255 - c) * 0.12));
  return ['rgb(' + rgb.join(',') + ')', linLum(rgb) > 0.42 ? '#000000' : '#ffffff'];
}

const INSTR = Object.fromEntries(INSTRUMENTS.map((i) => [i.id, i]));
const TYPE_LABEL = { etf: 'ETFs und Themen', stock: 'Aktien', crypto: 'Crypto', pm: 'Private Markets', bond: 'Zinsprodukte' };
const TYPE_COLOR = { etf: '#0a5cff', stock: '#0a2f8f', crypto: '#f7931a', pm: '#c9b48a', bond: '#7b3fe4' };
const TILE_COLOR = { etf: ['#fff', '#000'], pm: ['#c9b48a', '#000'], bond: ['#dcdce0', '#000'] };
const VOLA = { etf: 0.8, stock: 2.4, crypto: 3.6, pm: 0.15, bond: 0.25 };

/* ---------- Generator ---------- */

function generate(seed, opts) {
  opts = opts || {};
  const R = makeRand(seed);
  const now = Date.now();
  let seq = 1;
  const nid = (p) => p + seq++;

  /* Person & Kontakte */
  const last = R.pick(POOL.last);
  const firsts = R.shuffle(POOL.first);
  const user = { first: firsts[0], last };
  const contacts = [];
  for (let i = 1; i <= 2; i++) contacts.push({ id: nid('c'), name: firsts[i] + ' ' + last });
  const lasts = R.shuffle(POOL.last.filter((l) => l !== last));
  for (let i = 3; i <= 7; i++) contacts.push({ id: nid('c'), name: firsts[i] + ' ' + lasts[i] });
  contacts.forEach((c) => (c.iban = makeIban(R)));
  const landlord = { id: nid('c'), name: 'Hausverwaltung ' + lasts[9], iban: makeIban(R) };

  /* Markt */
  const market = {};
  INSTRUMENTS.forEach((ins) => {
    const price = ins.base * R.f(0.86, 1.18);
    market[ins.id] = { price: round2(price), day: round2(R.normal() * VOLA[ins.type]) };
  });
  // ein paar auffällige „Top movers“
  const movers = R.sample(INSTRUMENTS.filter((i) => i.type === 'stock'), 4).map((i) => i.id);
  movers.forEach((id, k) => (market[id].day = round2((k % 2 ? -1 : 1) * R.f(7, 26))));

  /* Depot */
  const etfs = R.shuffle(INSTRUMENTS.filter((i) => i.type === 'etf'));
  const stocks = R.shuffle(INSTRUMENTS.filter((i) => i.type === 'stock'));
  const positions = [];
  const mkPos = (ins, value, perf) => positions.push({ iid: ins.id, value: round2(value), invested: round2(value / (1 + perf / 100)) });
  mkPos(etfs[0], R.f(150, 4200), R.f(1, 24));
  if (R.chance(0.45)) mkPos(etfs[1], R.f(80, 1500), R.f(-3, 15));
  const nStocks = R.i(2, 4);
  for (let i = 0; i < nStocks; i++) mkPos(stocks[i], R.f(10, 900), R.f(-18, 46));
  const watchlist = R.sample(INSTRUMENTS.filter((i) => i.acct === 'brokerage' || i.type === 'crypto'), R.i(6, 12)).map((i) => i.id);
  const recent = R.sample(stocks.slice(4), 5).map((i) => i.id);
  const ipos = R.sample(POOL.ipo, 3);
  const pfMaxDays = R.i(420, 1150);

  /* Cash-Konten */
  const interestRate = R.pick([2, 2.25, 2.5]);
  const accounts = [{ id: 'main', name: 'Hauptkonto', main: true, icon: 'euro', balance: R.money(140, 2600), iban: makeIban(R), goal: null, rule: null, roundUp: false, createdAt: now - 900 * DAY }];
  if (!opts.noSubs) {
    const presets = R.sample(SUB_PRESETS, 3);
    presets.forEach((p, i) => {
      const goal = p.goal ? Math.round(R.f(p.goal[0], p.goal[1]) / 50) * 50 : null;
      const balance = goal ? R.money(goal * 0.12, goal * 0.85) : R.money(120, 1400);
      accounts.push({
        id: nid('a'), name: p.name, main: false, fixed: !!p.fixed, icon: p.icon,
        balance, iban: makeIban(R), goal,
        rule: { amount: R.pick([25, 50, 75, 100, 150]), day: 1 },
        roundUp: i === 0 && R.chance(0.6), createdAt: now - R.i(60, 300) * DAY,
      });
    });
  }
  const subs = accounts.filter((a) => !a.main);
  const fixedAcc = subs.find((a) => a.fixed);

  /* Sparplan & Abos */
  const planDay = new Date(now + DAY).getDate() <= 28 && R.chance(0.5) ? new Date(now + DAY).getDate() : R.i(2, 27);
  const plans = [{ id: nid('p'), iid: etfs[0].id, amount: R.pick([25, 50, 100, 150]), day: planDay, accountId: 'main' }];
  const subAbo = R.pick(MERCHANTS.filter((m) => m[1] === 'Unterhaltung' && m[2] === m[3]));
  const scheduled = [{ id: nid('s'), title: subAbo[0], logo: subAbo[5] || null, amount: subAbo[2], day: new Date(now + R.i(3, 12) * DAY).getDate(), accountId: 'main', category: 'Unterhaltung' }];
  const utility = R.pick(UTILITY);
  const employer = R.pick(POOL.employer);
  const salary = R.money(520, 2400);
  const salaryDay = R.i(1, 4);
  const rent = R.money(380, 890);

  /* Transaktionen */
  const tx = [];
  const add = (o) => {
    const t = Object.assign({ id: nid('t'), status: '', cancelled: false, fx: null, person: false, sub: '', pair: null, dir: null, other: null, iid: null, logo: null }, o);
    t.amount = round2(t.amount);
    tx.push(t);
    return t;
  };
  const internal = (fromId, toId, amount, date) => {
    const pair = nid('x');
    const from = accounts.find((a) => a.id === fromId);
    const to = accounts.find((a) => a.id === toId);
    add({ accountId: fromId, date, title: to.name, amount: -amount, kind: 'internal', category: 'Umbuchung', icon: 'g_swap', status: 'Umbuchung', pair, dir: 'out', other: toId });
    add({ accountId: toId, date: date + 1, title: from.name, amount, kind: 'internal', category: 'Umbuchung', icon: 'g_swap', status: 'Umbuchung', pair, dir: 'in', other: fromId });
  };

  const today0 = startOfDay(now);
  const at = (d) => {
    const ts = today0 - d * DAY + R.i(7, 21) * 36e5 + R.i(0, 59) * 6e4;
    return d === 0 ? Math.min(ts, now - R.i(4, 90) * 6e4) : ts;
  };
  const cardMerchants = MERCHANTS.filter((m) => !(m[2] === m[3] && m[1] !== 'Transport'));
  for (let d = 0; d < 170; d++) {
    const date = new Date(today0 - d * DAY);
    const dom = date.getDate();
    if (dom === 1) {
      add({ accountId: 'main', date: at(d), title: 'Zinsen', amount: R.money(0.3, 2.6), kind: 'interest', category: 'Zinsen', icon: 'pct' });
      subs.forEach((a) => {
        if (a.rule && +date > a.createdAt) internal('main', a.id, a.rule.amount, at(d));
      });
    }
    if (dom === 2) add({ accountId: fixedAcc ? fixedAcc.id : 'main', date: at(d), title: utility, amount: -R.money(18, 64), kind: 'card', category: 'Wohnen und Versorgung', icon: 'g_doc' });
    if (dom === 3 && fixedAcc && +date > fixedAcc.createdAt) {
      internal('main', fixedAcc.id, rent, at(d) - 36e5);
      add({ accountId: fixedAcc.id, date: at(d), title: landlord.name, amount: -rent, kind: 'transfer', category: 'Wohnen und Versorgung', person: true, status: 'Gesendet', sub: 'Miete' });
    }
    if (dom === salaryDay) add({ accountId: 'main', date: at(d), title: employer, amount: salary + R.money(-20, 20), kind: 'income', category: 'Einnahmen', icon: 'g_down', status: 'Fertig' });
    if (dom === plans[0].day && d > 0) add({ accountId: 'main', date: at(d), title: INSTR[plans[0].iid].name, amount: -plans[0].amount, kind: 'savingsplan', category: 'Investments', icon: 'g_chart', status: 'Sparplan', iid: plans[0].iid });
    if (dom === scheduled[0].day && d > 0) add({ accountId: 'main', date: at(d), title: scheduled[0].title, logo: scheduled[0].logo, amount: -scheduled[0].amount, kind: 'card', category: 'Unterhaltung', icon: 'g_play' });

    const n = R.chance(0.52) ? (R.chance(0.3) ? 2 : 1) : 0;
    for (let k = 0; k < n; k++) {
      const m = R.pick(cardMerchants);
      const t = { accountId: 'main', date: at(d), title: m[0], kind: 'card', category: m[1], icon: CATEGORIES[m[1]], logo: m[5] || null };
      if (m[4]) {
        const foreign = Math.round(R.f(m[2], m[3]));
        t.fx = { amount: foreign, cur: m[4] };
        t.amount = -round2(foreign * FX_RATE[m[4]]);
      } else t.amount = -R.money(m[2], m[3]);
      if (R.chance(0.04)) Object.assign(t, { cancelled: true, status: R.pick(['Abgebrochen', 'Abgelaufen']) });
      add(t);
    }
    if (R.chance(0.075)) {
      const c = R.pick(contacts);
      add({ accountId: 'main', date: at(d), title: c.name, amount: -R.money(8, 240), kind: 'transfer', category: 'Überweisungen', person: true, status: 'Gesendet' });
    }
    if (R.chance(0.05)) {
      const c = R.pick(contacts);
      add({ accountId: 'main', date: at(d), title: c.name, amount: R.money(8, 260), kind: 'income', category: 'Einnahmen', person: true, status: 'Fertig' });
    }
    if (R.chance(0.02)) add({ accountId: 'main', date: at(d), title: 'PayPal', logo: 'paypal', amount: R.money(5, 60), kind: 'income', category: 'Einnahmen', icon: 'g_down', status: 'Fertig' });
  }
  // ein, zwei Einzelkäufe, damit „Investments“ auch im laufenden Monat gefüllt ist
  const domNow = new Date(now).getDate();
  [R.i(1, Math.max(1, Math.min(domNow - 1, 12))), R.i(20, 75)].forEach((d, k) => {
    const p = positions[Math.min(positions.length - 1, 1 + k)];
    add({ accountId: 'main', date: at(d), title: INSTR[p.iid].name, amount: -R.pick([10, 15, 25, 50]), kind: 'trade', category: 'Investments', icon: 'g_chart', status: 'Kauf', iid: p.iid });
  });
  // gelegentliche Entnahmen aus Sparzielen
  subs.filter((a) => !a.fixed).forEach((a) => {
    if (R.chance(0.6)) internal(a.id, 'main', R.pick([20, 40, 60, 100]), at(R.i(8, 60)));
  });
  tx.sort((a, b) => b.date - a.date);

  const interestTotal = round2(sum(tx.filter((t) => t.kind === 'interest'), (t) => t.amount) + R.f(4, 380));

  return {
    v: STATE_VERSION, seed, createdAt: now, seq,
    user, contacts, market, positions, watchlist, recent, ipos, pfMaxDays,
    accounts, plans, scheduled, tx,
    card: { accountId: 'main', last4: String(R.i(1000, 9999)), exp: String(R.i(1, 12)).padStart(2, '0') + '/' + String((new Date(now).getFullYear() + R.i(2, 4)) % 100), pin: String(R.i(0, 9999)).padStart(4, '0'), locked: false },
    interest: { rate: interestRate, total: interestTotal, accrued: R.money(0.1, 1.4) },
    waitlist: R.chance(0.7),
  };
}

function insFacts(iid) {
  const ins = INSTR[iid];
  const meta = INS_META[iid] || { cap: 10, d: '' };
  const m = S.market[iid];
  const R = makeRand(hashStr(S.seed + '|facts|' + iid));
  const now = Date.now();
  const capV = meta.cap * R.f(0.92, 1.08);
  const capLabel = capV >= 1000 ? nf2.format(capV / 1000) + ' Bio. €' : nf01.format(capV) + ' Mrd. €';
  const prev = m.price / (1 + m.day / 100);
  const spread = m.price * R.f(0.0002, 0.0009);
  const cols = [];
  const price4 = [['Eröffnung', eur(prev * (1 + R.normal() * 0.003))], ['Vortag', eur(prev)], ['Geld', eur(m.price - spread)], ['Brief', eur(m.price + spread)]];
  const range = [['Tageshoch', eur(m.price * R.f(1.002, 1.018))], ['Tagestief', eur(m.price * R.f(0.981, 0.998))], ['52-Wochen-Hoch', eur(m.price * R.f(1.05, 1.42))], ['52-Wochen-Tief', eur(m.price * R.f(0.52, 0.93))]];
  let div = null;
  if (ins.type === 'stock') {
    const pe = R.f(9, 46);
    const yld = meta.nodiv ? 0 : R.f(0.4, 3.9);
    cols.push([['Unternehmenswert', capLabel], ['Kurs-Gewinn-Verhältnis', nf2.format(pe) + '×'], ['Gewinn je Aktie', eur(m.price / pe)], ['Dividendenrendite', yld ? pct2(yld) : '–']]);
    if (yld) div = round2((m.price * yld) / 100 / R.pick([1, 2, 4]));
  } else if (ins.type === 'etf') {
    cols.push([['Fondsvolumen', capLabel], ['Laufende Kosten (TER)', pct2(meta.ter || 0.2)], ['Ertragsverwendung', /Dist/.test(ins.name) ? 'Ausschüttend' : 'Thesaurierend'], ['Replikation', 'Physisch']]);
    if (/Dist/.test(ins.name)) div = round2(m.price * R.f(0.002, 0.006));
  } else if (ins.type === 'crypto') {
    const supply = (capV * 1e9) / m.price;
    const supplyLabel = supply >= 1e9 ? nf01.format(supply / 1e9) + ' Mrd.' : nf01.format(supply / 1e6) + ' Mio.';
    cols.push([['Marktkapitalisierung', capLabel], ['Volumen (24 h)', nf01.format(capV * R.f(0.01, 0.06)) + ' Mrd. €'], ['Im Umlauf', supplyLabel], ['Handel', 'Rund um die Uhr']]);
  } else {
    cols.push([['Volumen', capLabel], ['Mindestanlage', '1 €'], ['Handelbarkeit', ins.type === 'pm' ? 'Monatlich' : 'Börsentäglich'], ['Risikoklasse', ins.type === 'pm' ? '6 von 7' : '2 von 7']]);
  }
  cols.push(price4, range);
  const news = R.sample(NEWS_TEMPLATES, 3).map((t, i) => ({ title: t.replace('{n}', ins.name.replace(/ \(.*\)$/, '')), ago: [R.i(4, 55) + ' Minuten', R.i(2, 9) + ' Stunden', R.i(1, 3) + (i ? ' Tagen' : ' Tag')][i] }));
  news[2].ago = R.i(2, 4) + ' Tagen';
  const events = [];
  if (div) events.push({ date: now + R.i(6, 80) * DAY, title: 'Dividende', sub: eur(div) + ' je Anteil' });
  if (ins.type === 'stock') events.push({ date: now + R.i(9, 85) * DAY, title: 'Quartalszahlen', sub: 'Veröffentlichung der Geschäftszahlen' });
  events.sort((a, b) => a.date - b.date);
  const peers = R.sample(INSTRUMENTS.filter((x) => x.type === (ins.type === 'crypto' ? 'crypto' : 'stock') && x.id !== iid), 5).map((x) => x.id);
  return { desc: meta.d, cols, long: ins.type === 'stock' ? R.i(52, 94) : null, news, events, peers };
}

/**
 * Handelszeiten des Demo-Handelsplatzes: Mo–Fr 7:30–23:00 Uhr. Crypto ist immer handelbar.
 * frac: wie weit der Tageschart nach rechts reicht (läuft über den Handelstag weiter, endet nach Handelsschluss kurz vor dem Rand).
 */
function marketState(ins, ts) {
  if (ins.type === 'crypto') return { open: true, frac: 1 };
  const d = new Date(ts || Date.now());
  const mins = d.getHours() * 60 + d.getMinutes();
  const open = d.getDay() >= 1 && d.getDay() <= 5 && mins >= 450 && mins < 1380;
  return { open, frac: open ? 0.5 + 0.38 * clamp((mins - 450) / 930, 0, 1) : 0.88 };
}


/* ---------- Zustand & Persistenz ---------- */

const LS_KEY = 'cash-unterkonten-prototyp';
const MAX_SUBS = 10;
let S = null;

function save() {
  try {
    localStorage.setItem(LS_KEY, JSON.stringify(S));
  } catch (e) {
    /* privates Fenster o. Ä. – Demo läuft dann ohne Speichern */
  }
}

function urlSeed() {
  let raw = null;
  try {
    raw = new URLSearchParams(location.search).get('seed');
  } catch (e) {
    /* ignore */
  }
  if (!raw) return null;
  return /^\d{1,9}$/.test(raw) ? +raw : hashStr(raw) % 1000000;
}

function loadState() {
  const wanted = urlSeed();
  let saved = null;
  try {
    saved = JSON.parse(localStorage.getItem(LS_KEY) || 'null');
  } catch (e) {
    saved = null;
  }
  if (saved && saved.v === STATE_VERSION && (wanted === null || saved.seed === wanted)) {
    S = saved;
    return;
  }
  S = generate(wanted === null ? randomSeed() : wanted);
  save();
}

const randomSeed = () => 10000 + Math.floor(Math.random() * 90000);

function reroll(opts) {
  S = generate(randomSeed(), opts);
  save();
}

/** Geplante Zahlungen (nächster Termin je Eintrag), aus Sicht eines Kontos oder aller Konten. */
function upcoming(view) {
  const now = Date.now();
  const out = [];
  S.plans.forEach((p) => {
    if (view !== 'all' && p.accountId !== view) return;
    out.push({ key: 'plan:' + p.id, title: INSTR[p.iid].name, iid: p.iid, sub: 'Sparplan', amount: -p.amount, date: nextDayOfMonth(p.day, now), accountId: p.accountId, icon: 'g_chart', planId: p.id });
  });
  S.scheduled.forEach((s) => {
    if (view !== 'all' && s.accountId !== view) return;
    out.push({ key: 'sched:' + s.id, title: s.title, logo: s.logo || null, sub: 'Abo', amount: -s.amount, date: nextDayOfMonth(s.day, now), accountId: s.accountId, icon: 'g_play' });
  });
  subAccounts().forEach((a) => {
    if (!a.rule) return;
    const date = nextDayOfMonth(a.rule.day, now);
    if (view === 'all') out.push({ key: 'rule:' + a.id, title: 'Hauptkonto → ' + a.name, sub: 'Regel', amount: -a.rule.amount, internal: true, date, accountId: 'main', icon: 'g_repeat' });
    else if (view === 'main') out.push({ key: 'rule:' + a.id, title: a.name, sub: 'Regel', amount: -a.rule.amount, date, accountId: 'main', icon: 'g_repeat' });
    else if (view === a.id) out.push({ key: 'rule:' + a.id, title: 'Hauptkonto', sub: 'Regel', amount: a.rule.amount, date, accountId: a.id, icon: 'g_repeat' });
  });
  return out.sort((a, b) => a.date - b.date);
}
function upcomingSoon(view) {
  const limit = startOfDay(Date.now()) + 14 * DAY;
  const list = upcoming(view).filter((u) => u.date <= limit);
  return { list, total: sum(list.filter((u) => !u.internal), (u) => Math.abs(u.amount)) };
}

const isInvestTx = (t) => t.kind === 'savingsplan' || t.kind === 'trade';

function monthStats(mk, view) {
  const list = S.tx.filter((t) => monthKey(t.date) === mk && !t.cancelled && t.kind !== 'internal' && (view === 'all' || t.accountId === view));
  const income = sum(list.filter((t) => t.amount > 0 && !isInvestTx(t)), (t) => t.amount);
  const invest = Math.max(0, -sum(list.filter(isInvestTx), (t) => t.amount));
  const spendList = list.filter((t) => t.amount < 0 && !isInvestTx(t));
  const spend = -sum(spendList, (t) => t.amount);
  const cats = {};
  spendList.forEach((t) => (cats[t.category] = (cats[t.category] || 0) - t.amount));
  const catList = Object.entries(cats).map(([name, amount]) => ({ name, amount })).sort((a, b) => b.amount - a.amount);
  return { income, invest, spend, cats: catList };
}

const positionsOf = (pfAcc) => S.positions.filter((p) => INSTR[p.iid].acct === pfAcc);
const pfValue = (pfAcc) => sum(pfAcc ? positionsOf(pfAcc) : S.positions, (p) => p.value);

/* ---------- Mutationen ---------- */

function pushTx(o) {
  const t = Object.assign({ id: 't' + S.seq++, date: Date.now(), status: '', cancelled: false, fx: null, person: false, sub: '', pair: null, dir: null, other: null, iid: null, logo: null }, o);
  t.amount = round2(t.amount);
  S.tx.unshift(t);
  return t;
}

function moveMoney(fromId, toId, amount, label) {
  const from = acc(fromId);
  const to = acc(toId);
  amount = round2(amount);
  from.balance = round2(from.balance - amount);
  to.balance = round2(to.balance + amount);
  const pair = 'x' + S.seq++;
  const now = Date.now();
  const status = label || 'Umbuchung';
  pushTx({ accountId: toId, date: now, title: from.name, amount, kind: 'internal', category: 'Umbuchung', icon: 'g_swap', status, pair, dir: 'in', other: fromId });
  pushTx({ accountId: fromId, date: now + 1, title: to.name, amount: -amount, kind: 'internal', category: 'Umbuchung', icon: 'g_swap', status, pair, dir: 'out', other: toId });
  save();
}

function sendMoney(fromId, contact, amount) {
  const from = acc(fromId);
  from.balance = round2(from.balance - amount);
  pushTx({ accountId: fromId, title: contact.name, amount: -amount, kind: 'transfer', category: 'Überweisungen', person: true, status: 'Gesendet' });
  save();
}

function depositMoney(toId, amount) {
  const to = acc(toId);
  to.balance = round2(to.balance + amount);
  pushTx({ accountId: toId, title: 'Einzahlung', amount, kind: 'income', category: 'Einnahmen', icon: 'g_down', status: 'Fertig' });
  save();
}

function createAccount(o) {
  const R = makeRand((S.seed * 31 + S.seq * 7919) >>> 0);
  const a = { id: 'a' + S.seq++, name: o.name.trim(), main: false, fixed: false, icon: o.icon, balance: 0, iban: makeIban(R), goal: o.goal || null, rule: null, roundUp: false, createdAt: Date.now() };
  S.accounts.push(a);
  save();
  return a;
}

function closeAccount(id) {
  const a = acc(id);
  if (!a || a.main) return;
  if (a.balance > 0) moveMoney(id, 'main', a.balance, 'Kontoschließung');
  S.tx = S.tx.filter((t) => t.accountId !== id);
  S.accounts = S.accounts.filter((x) => x.id !== id);
  S.plans.forEach((p) => p.accountId === id && (p.accountId = 'main'));
  S.scheduled.forEach((s) => s.accountId === id && (s.accountId = 'main'));
  if (S.card.accountId === id) S.card.accountId = 'main';
  save();
}

function tradeBuy(iid, amount, fromId) {
  const a = acc(fromId);
  a.balance = round2(a.balance - amount);
  let p = position(iid);
  if (!p) {
    p = { iid, value: 0, invested: 0 };
    S.positions.push(p);
  }
  p.value = round2(p.value + amount);
  p.invested = round2(p.invested + amount);
  pushTx({ accountId: fromId, title: INSTR[iid].name, amount: -amount, kind: 'trade', category: 'Investments', icon: 'g_chart', status: 'Kauf', iid });
  save();
}

function tradeSell(iid, amount, toId) {
  const p = position(iid);
  if (!p) return;
  const share = Math.min(1, amount / p.value);
  p.invested = round2(p.invested * (1 - share));
  p.value = round2(p.value - amount);
  if (p.value < 0.01) S.positions = S.positions.filter((x) => x !== p);
  acc(toId).balance = round2(acc(toId).balance + amount);
  pushTx({ accountId: toId, title: INSTR[iid].name, amount, kind: 'trade', category: 'Investments', icon: 'g_chart', status: 'Verkauf', iid });
  save();
}

/** Demo: zufällige Kartenzahlung vom verknüpften Konto, inkl. Aufrunden. */
function simulateCardPayment() {
  const R = makeRand((Date.now() ^ (S.seq * 2654435761)) >>> 0);
  if (S.card.locked) return { error: 'Karte ist gesperrt' };
  const from = acc(S.card.accountId) || acc('main');
  const pool = MERCHANTS.filter((m) => !m[4] && m[2] !== m[3] && m[3] <= 70);
  let m = R.pick(pool);
  let amount = R.money(m[2], m[3]);
  if (amount > from.balance) {
    if (from.balance < 1) return { error: 'Nicht genug Guthaben auf „' + from.name + '“' };
    amount = R.money(Math.min(1, from.balance), Math.min(from.balance, 9));
    m = R.pick(pool.filter((x) => x[2] <= 9));
  }
  from.balance = round2(from.balance - amount);
  pushTx({ accountId: from.id, title: m[0], amount: -amount, kind: 'card', category: m[1], icon: CATEGORIES[m[1]], logo: m[5] || null });
  let rounded = 0;
  const target = S.accounts.find((a) => a.roundUp && a.id !== from.id);
  if (target) {
    rounded = round2(Math.ceil(amount) - amount);
    if (rounded > 0 && rounded <= from.balance) moveMoney(from.id, target.id, rounded, 'Aufrunden');
    else rounded = 0;
  }
  save();
  return { merchant: m[0], amount, from, rounded, target };
}


/* ---------- Kursverläufe (deterministisch aus dem Seed) ---------- */

const TF_LIST = [['d', '1T'], ['w', '1W'], ['m', '1M'], ['y', '1J'], ['max', 'Max']];
// Alle Zeiträume haben gleich viele Punkte, damit der Chart beim Wechsel weich von Kurve zu Kurve morphen kann.
const CH_N = 120;
const TF_CFG = {
  d: { n: CH_N, span: 0.42, floor: 0.004, pct: 0.9 },
  w: { n: CH_N, span: 7, floor: 0.012, pct: 2.2 },
  m: { n: CH_N, span: 30, floor: 0.03, pct: 4.5 },
  y: { n: CH_N, span: 365, floor: 0.07, pct: 12 },
  max: { n: CH_N, span: 800, floor: 0.1, pct: 30 },
};

/**
 * Erzeugt eine Kurve, die exakt beim aktuellen Wert endet.
 * opts.pct: feste Rendite für den Zeitraum, opts.span: Tage
 */
function genSeries(key, tf, endValue, opts) {
  opts = opts || {};
  const cfg = TF_CFG[tf];
  const R = makeRand(hashStr(S.seed + '|' + key + '|' + tf));
  const n = cfg.n;
  let pct = opts.pct;
  if (pct === undefined || pct === null) pct = tf === 'y' ? 6 + R.normal() * cfg.pct : R.normal() * cfg.pct;
  pct = Math.max(pct, -80);
  const end = endValue > 0 ? endValue : 100;
  const start = end / (1 + pct / 100);
  const walk = [0];
  for (let i = 1; i < n; i++) walk.push(walk[i - 1] + R.normal());
  const lastW = walk[n - 1];
  const raw = walk.map((v, i) => v - (lastW * i) / (n - 1));
  // leicht glätten: der Verlauf bleibt lebendig, zittert aber nicht von Punkt zu Punkt
  const bridge = raw.map((v, i) => (i === 0 || i === n - 1 ? v : 0.25 * raw[i - 1] + 0.5 * v + 0.25 * raw[i + 1]));
  const maxAbs = Math.max.apply(null, bridge.map(Math.abs)) || 1;
  const amp = R.f(0.3, 0.62) * Math.max(Math.abs(end - start), end * cfg.floor);
  const k = R.f(0.75, 2.1);
  const values = bridge.map((b, i) => {
    const t = i / (n - 1);
    return Math.max(end * 0.02, start + (end - start) * Math.pow(t, k) + (amp * b) / maxAbs);
  });
  values[n - 1] = end;
  const now = Date.now();
  const span = (opts.span || cfg.span) * DAY;
  const dates = values.map((_, i) => now - span + (span * i) / (n - 1));
  return { values, dates, base: start, pct, tf, real: endValue > 0, xf: opts.xf || 1 };
}

function pfSeries(pfAcc, tf) {
  const pos = positionsOf(pfAcc);
  const total = sum(pos, (p) => p.value);
  const invested = sum(pos, (p) => p.invested);
  let pct = null;
  if (tf === 'max') pct = invested > 0 ? (total / invested - 1) * 100 : 0;
  if (tf === 'd') pct = total > 0 ? sum(pos, (p) => p.value * S.market[p.iid].day) / total : 0;
  return genSeries('pf-' + pfAcc, tf, total, { pct, span: tf === 'max' ? S.pfMaxDays : null });
}

function insSeries(iid, tf) {
  const m = S.market[iid];
  return genSeries('ins-' + iid, tf, m.price, { pct: tf === 'd' ? m.day : null, xf: tf === 'd' ? marketState(INSTR[iid]).frac : 1 });
}

/* ---------- SVG-Chart ---------- */

const CHARTS = {};
const CH_W = 390;
const CH_H = 230;

function buildLine(ys, xf) {
  let d = '';
  const n = ys.length;
  const w = CH_W * (xf || 1);
  const x = (i) => (i / (n - 1)) * w;
  // Kurve durch die Mittelpunkte benachbarter Punkte: weiche Bögen statt Zacken
  d = 'M0 ' + ys[0].toFixed(1);
  for (let i = 1; i < n - 1; i++) d += 'Q' + x(i).toFixed(1) + ' ' + ys[i].toFixed(1) + ' ' + ((x(i) + x(i + 1)) / 2).toFixed(1) + ' ' + ((ys[i] + ys[i + 1]) / 2).toFixed(1);
  return d + 'L' + x(n - 1).toFixed(1) + ' ' + ys[n - 1].toFixed(1);
}
/** y-Position der geglätteten Linie am Punkt i (für den Cursor beim Scrubben). */
const lineY = (ys, i) => (i <= 0 || i >= ys.length - 1 ? ys[clamp(i, 0, ys.length - 1)] : 0.125 * ys[i - 1] + 0.75 * ys[i] + 0.125 * ys[i + 1]);

function chartHTML(series, cid) {
  const v = series.values;
  const lo = Math.min(series.base, Math.min.apply(null, v));
  const hi = Math.max(series.base, Math.max.apply(null, v));
  const padT = 14;
  const padB = 14;
  const y = (val) => padT + (1 - (val - lo) / (hi - lo || 1)) * (CH_H - padT - padB);
  const ys = v.map(y);
  const by = y(series.base);
  const xf = series.xf || 1;
  CHARTS[cid] = { series, ys, by, xf, sig: series.tf + '|' + v[v.length - 1].toFixed(2) + '|' + series.base.toFixed(2) + '|' + xf.toFixed(3) };
  return `<div class="chart" data-cid="${cid}">
    <svg viewBox="0 0 ${CH_W} ${CH_H}" preserveAspectRatio="none">
      <path class="ch-base" d="M0 ${by.toFixed(1)}H${CH_W}" vector-effect="non-scaling-stroke"/>
      <path class="ch-line" d="${buildLine(ys, xf)}" vector-effect="non-scaling-stroke"/>
    </svg>
    <div class="ch-cursor" hidden><i></i></div>
  </div>`;
}

/** Nach jedem Rendern aufrufen: lässt geänderte Charts weich von der alten zur neuen Kurve laufen. */
function syncCharts(root) {
  root.querySelectorAll('.chart[data-cid]').forEach((el) => {
    const c = CHARTS[el.dataset.cid];
    if (!c) return;
    const drawn = el._drawn;
    if (!drawn || drawn.ys.length !== c.ys.length) {
      el._drawn = { ys: c.ys.slice(), by: c.by, xf: c.xf };
      el._sig = c.sig;
      return;
    }
    if (el._sig === c.sig) return;
    el._sig = c.sig;
    const from = { ys: drawn.ys.slice(), by: drawn.by, xf: drawn.xf || 1 };
    const to = { ys: c.ys, by: c.by, xf: c.xf };
    const line = el.querySelector('.ch-line');
    const base = el.querySelector('.ch-base');
    const token = (el._tw = {});
    const t0 = performance.now();
    const frame = (now) => {
      if (el._tw !== token || !el.isConnected) return;
      const t = clamp((now - t0) / 620, 0, 1);
      const e = t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
      const ys = from.ys.map((y0, i) => y0 + (to.ys[i] - y0) * e);
      const by = from.by + (to.by - from.by) * e;
      const xf = from.xf + (to.xf - from.xf) * e;
      line.setAttribute('d', buildLine(ys, xf));
      base.setAttribute('d', 'M0 ' + by.toFixed(1) + 'H' + CH_W);
      el._drawn = { ys, by, xf };
      if (t < 1) requestAnimationFrame(frame);
    };
    frame(t0);
  });
}

function chartLabelDate(ts, tf) {
  if (tf === 'd') return timeShort(ts);
  if (tf === 'w') return dayShort(ts) + ', ' + timeShort(ts);
  const d = new Date(ts);
  return dayShort(ts) + (tf === 'max' || tf === 'y' ? ' ' + d.getFullYear() : '');
}

const tri = (up) => `<i class="tri ${up ? 'up' : 'down'}"></i>`;
const fmtChange = (v) => (v !== 0 && Math.abs(v) < 0.1 ? new Intl.NumberFormat('de-DE', { minimumFractionDigits: 2, maximumFractionDigits: 4 }).format(Math.abs(v)) + NBSP + '€' : eurAbs(v));
/** Veränderung als Prozent oder – wenn umgeschaltet (ui.abs) und ein Betrag bekannt ist – als absoluter Wert in €. */
const deltaHTML = (pct, abs) => (ui.abs && abs !== undefined && abs !== null ? tri(abs >= 0) + fmtChange(abs) : tri(pct >= 0) + pct2(pct));
const chgHTML = (pct, abs) => `<span class="chg ${pct >= 0 ? 'up' : 'down'}" data-a="toggleAbs">${deltaHTML(pct, abs)}</span>`;
const dayAbs = (iid) => S.market[iid].price - S.market[iid].price / (1 + S.market[iid].day / 100);

/** Scrubbing: Finger/Maus auf dem Chart zeigt Wert, Rendite und Datum des Punkts. */
function bindCharts(root) {
  let active = null;
  const update = (el, clientX) => {
    const c = CHARTS[el.dataset.cid];
    if (!c) return;
    const rect = el.getBoundingClientRect();
    const t = clamp((clientX - rect.left) / rect.width / c.xf, 0, 1);
    const i = Math.round(t * (c.series.values.length - 1));
    const val = c.series.values[i];
    const scope = el.closest('[data-chart-root]');
    const cur = el.querySelector('.ch-cursor');
    cur.hidden = false;
    cur.style.left = (i / (c.series.values.length - 1)) * c.xf * 100 + '%';
    cur.firstElementChild.style.top = (lineY(c.ys, i) / CH_H) * 100 + '%';
    if (!scope) return;
    const amount = scope.querySelector('[data-chart-amount]');
    const delta = scope.querySelector('[data-chart-delta]');
    const date = scope.querySelector('[data-chart-date]');
    if (amount) amount.textContent = eur(c.series.real ? val : 0);
    if (delta) delta.innerHTML = deltaHTML((val / c.series.base - 1) * 100, c.series.real ? val - c.series.base : 0);
    if (date) date.textContent = chartLabelDate(c.series.dates[i], c.series.tf);
  };
  const reset = (el) => {
    const c = CHARTS[el.dataset.cid];
    const scope = el.closest('[data-chart-root]');
    el.querySelector('.ch-cursor').hidden = true;
    if (!c || !scope) return;
    const v = c.series.values;
    const amount = scope.querySelector('[data-chart-amount]');
    const delta = scope.querySelector('[data-chart-delta]');
    const date = scope.querySelector('[data-chart-date]');
    if (amount) amount.textContent = eur(c.series.real ? v[v.length - 1] : 0);
    if (delta) delta.innerHTML = deltaHTML(c.series.pct, c.series.real ? v[v.length - 1] - c.series.base : 0);
    if (date) date.textContent = '';
  };
  root.addEventListener('pointerdown', (e) => {
    const el = e.target.closest('.chart');
    if (!el) return;
    active = el;
    update(el, e.clientX);
  });
  root.addEventListener('pointermove', (e) => {
    const el = e.target.closest('.chart');
    if (active) update(active, e.clientX);
    else if (el && e.pointerType === 'mouse') update(el, e.clientX);
  });
  const end = () => {
    if (active) reset(active);
    active = null;
  };
  root.addEventListener('pointerup', end);
  root.addEventListener('pointercancel', end);
  root.addEventListener('pointerout', (e) => {
    const el = e.target.closest('.chart');
    if (el && !active && e.pointerType === 'mouse' && !el.contains(e.relatedTarget)) reset(el);
  });
}

/* ---------- Ring & Donut ---------- */

function ringSVG(share, color) {
  const r = 7;
  const c = 2 * Math.PI * r;
  const s = clamp(share, 0, 1);
  const cap = s > 0.03 && s < 0.97 ? 'round' : 'butt';
  return `<svg class="ring" viewBox="0 0 20 20"><circle cx="10" cy="10" r="${r}" fill="none" stroke="#2a2a2e" stroke-width="3.2"/><circle class="ring-arc" cx="10" cy="10" r="${r}" fill="none" stroke="${color}" stroke-width="3.2" stroke-linecap="${cap}" style="stroke-dasharray:${(c * s).toFixed(2)} ${c.toFixed(2)};opacity:${s > 0.004 ? 1 : 0}" transform="rotate(-90 10 10)"/></svg>`;
}

function donutSVG(parts) {
  const total = sum(parts, (p) => p.value) || 1;
  const r = 36;
  const c = 2 * Math.PI * r;
  const gap = parts.length > 1 ? 2.2 : 0;
  let off = 0;
  const segs = parts
    .map((p) => {
      const len = (p.value / total) * c;
      const seg = `<circle cx="60" cy="60" r="${r}" fill="none" stroke="${p.color}" stroke-width="30" stroke-dasharray="${Math.max(0.5, len - gap).toFixed(2)} ${c.toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 60 60)"/>`;
      off += len;
      return seg;
    })
    .join('');
  return `<svg class="donut" viewBox="0 0 120 120">${segs}</svg>`;
}

function txGroupsHTML(list, view) {
  const now = Date.now();
  let out = '';
  let cur = null;
  list.forEach((t) => {
    const label = monthGroupLabel(t.date, now);
    if (label !== cur) {
      out += secHTML(label);
      cur = label;
    }
    out += txRow(t, view);
  });
  return out;
}

const parseAmt = (s) => (s ? parseFloat(s.replace(',', '.')) || 0 : 0);
const toAmtString = (v) => String(round2(v)).replace('.', ',');
function amtShow(s) {
  if (!s) return '0';
  const parts = s.split(',');
  return nf0.format(+parts[0]) + (parts.length > 1 ? ',' + parts[1] : '');
}
function amtPress(s, k) {
  if (k === 'del') return s.slice(0, -1);
  if (k === ',') return s.includes(',') ? s : s === '' ? '0,' : s + ',';
  if (s === '0') return k;
  const parts = s.split(',');
  if (parts.length > 1) return parts[1].length >= 2 ? s : s + k;
  return parts[0].length >= 6 ? s : s + k;
}
const keypadHTML = () =>
  `<div class="keypad">${['1', '2', '3', '4', '5', '6', '7', '8', '9', ',', '0', 'del'].map((k) => `<button data-a="amtKey" data-k="${k}">${k === 'del' ? ICON.del : k}</button>`).join('')}</div>`;

const currentCashAcc = () => (ui.tab === 'cash' && ui.cashAcc !== 'all' && acc(ui.cashAcc) ? ui.cashAcc : 'main');

function openMove(fromId, toId) {
  const subs = subAccounts();
  if (!subs.length) return;
  const st = { from: fromId || 'main', to: toId || null };
  if (!st.to || st.to === st.from) st.to = st.from === 'main' ? subs[0].id : 'main';
  const fix = (changed) => {
    if (st.from !== st.to) return;
    const other = S.accounts.find((a) => a.id !== st[changed]);
    st[changed === 'from' ? 'to' : 'from'] = other.id;
  };
  openSheet('amount', {
    title: 'Umbuchen',
    sub: 'Zwischen deinen Konten – sofort und kostenlos',
    amt: '',
    cta: 'Umbuchen',
    swap: () => {
      const f = st.from;
      st.from = st.to;
      st.to = f;
    },
    rows: () => [
      accPick('Von', st.from, (id) => {
        st.from = id;
        fix('from');
      }),
      accPick('Nach', st.to, (id) => {
        st.to = id;
        fix('to');
      }),
    ],
    validate: (v) => (v > acc(st.from).balance + 1e-9 ? 'Nicht genug Guthaben auf „' + acc(st.from).name + '“' : ''),
    quick: () => [{ label: 'Alles', value: acc(st.from).balance }, { label: '10 €', value: 10 }, { label: '50 €', value: 50 }, { label: '100 €', value: 100 }],
    onConfirm: (v) => {
      moveMoney(st.from, st.to, v);
      return eur(v) + ' nach „' + acc(st.to).name + '“ umgebucht';
    },
  });
}

function openSend(contact) {
  const st = { from: currentCashAcc() };
  openSheet('amount', {
    title: 'Überweisen',
    sub: 'An ' + contact.name,
    amt: '',
    cta: 'Senden',
    rows: () => [
      accPick('Von', st.from, (id) => (st.from = id)),
      { label: 'An', icon: `<span class="tx-av">${esc(contact.name[0])}</span>`, name: esc(contact.name), right: ibanTail(contact.iban), pick: null },
    ],

    quick: () => [{ label: '10 €', value: 10 }, { label: '25 €', value: 25 }, { label: '50 €', value: 50 }],
    onConfirm: (v) => {

}

/* ---------- Statistik ---------- */

function tangentCircle(A, B, r, gap) {
  const R1 = A.r + r + gap;
  const R2 = B.r + r + gap;
  const dx = B.x - A.x;
  const dy = B.y - A.y;
  const d = Math.hypot(dx, dy) || 1;
  const a = (R1 * R1 - R2 * R2 + d * d) / (2 * d);
  const h = Math.sqrt(Math.max(0, R1 * R1 - a * a));
  const mx = A.x + (a * dx) / d;
  const my = A.y + (a * dy) / d;
  const p1 = { x: mx + (h * dy) / d, y: my - (h * dx) / d };
  const p2 = { x: mx - (h * dy) / d, y: my + (h * dx) / d };
  return p1.y > p2.y ? p1 : p2;
}

const bubble = (c, color, value, label, action, extra, key) =>
  `<button class="bubble" data-key="bub-${key}" data-a="${action}" ${extra || ''} style="left:${(c.x - c.r).toFixed(1)}px;top:${(c.y - c.r).toFixed(1)}px;width:${(c.r * 2).toFixed(1)}px;height:${(c.r * 2).toFixed(1)}px;background:${color}"><b>${eur0(value)}</b><span>${label}</span></button>`;

function statsOverviewBubbles(st) {
  const vmax = Math.max(st.income, st.spend, st.invest, 1);
  const rad = (v) => (v > 0 ? Math.max(41, 59 * Math.sqrt(v / vmax)) : 38);
  const A = { r: rad(st.income) };
  const B = { r: rad(st.spend) };
  const C = { r: rad(st.invest) };
  A.x = 0;
  A.y = 0;
  const ang = (-29 * Math.PI) / 180;
  B.x = (A.r + B.r + 4) * Math.cos(ang);
  B.y = (A.r + B.r + 4) * Math.sin(ang);
  Object.assign(C, tangentCircle(A, B, C.r, 4));
  const all = [A, B, C];
  const minX = Math.min.apply(null, all.map((c) => c.x - c.r));
  const maxX = Math.max.apply(null, all.map((c) => c.x + c.r));
  const minY = Math.min.apply(null, all.map((c) => c.y - c.r));
  const maxY = Math.max.apply(null, all.map((c) => c.y + c.r));
  const W = 337;
  const offX = (W - (maxX - minX)) / 2 - minX;
  all.forEach((c) => {
    c.x += offX;
    c.y += 8 - minY;
  });
  return `<div class="bubbles" style="height:${(maxY - minY + 16).toFixed(0)}px"><div class="bubbles-in" style="width:${W}px">
    ${bubble(A, 'var(--green)', st.income, 'Einnahmen', 'statMode', 'data-mode="income"', 'income')}
    ${bubble(B, '#7a3ff0', st.spend, 'Ausgaben', 'statMode', 'data-mode="spend"', 'spend')}
    ${bubble(C, '#0a5cff', st.invest, 'Investments', 'statMode', 'data-mode="invest"', 'invest')}
  </div></div>`;
}

function statsCategoryBubbles(st) {
  const vmax = st.cats.length ? st.cats[0].amount : 1;
  let html = `<button class="bubble back" data-a="statMode" data-mode="overview" style="left:-96px;top:44px;width:124px;height:124px;background:var(--green)" aria-label="Zurück zur Übersicht"></button>`;
  let width = 60;
  st.cats.forEach((c, i) => {
    const col = Math.floor(i / 2);
    const top = i % 2 === 0;
    const r = 42 + 9 * Math.sqrt(c.amount / vmax);
    const x = 96 + col * 106;
    const y = top ? 58 + (col % 2 ? -10 : 8) : 166 + (col % 2 ? -6 : 10);
    const op = 0.55 + 0.45 * Math.sqrt(c.amount / vmax);
    html += bubble({ x, y, r }, `rgba(108,58,232,${op.toFixed(2)})`, c.amount, esc(c.name), 'statCat', `data-cat="${esc(c.name)}"`, 'cat-' + i);
    width = Math.max(width, x + r + 28);
  });
  if (!st.cats.length) html += '<p class="empty" style="padding-top:90px;padding-left:80px">Keine Ausgaben in diesem Monat.</p>';
  return `<div class="bubbles scroll" style="height:232px" data-scroll="statbub"><div class="bubbles-in" style="width:${Math.max(337, width)}px">${html}</div></div>`;
}

/* ---------- Rendering ---------- */

let $main;
let $head;
let $view;
let $sheets;
let $toast;
const cache = { head: null, body: null, key: null, force: false };
let sheetSeq = 0;
let suppressClickUntil = 0;
const EASE = 'cubic-bezier(.32,.72,0,1)';
const reduceMotion = () => window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function saveScroll(root) {
  const m = {};
  root.querySelectorAll('[data-scroll]').forEach((el) => (m[el.dataset.scroll] = el.scrollLeft));
  return m;
}
function restoreScroll(root, m) {
  root.querySelectorAll('[data-scroll]').forEach((el) => {
    if (m[el.dataset.scroll]) el.scrollLeft = m[el.dataset.scroll];
  });
}

/* ---------- DOM-Abgleich ----------
 * Statt innerHTML komplett zu ersetzen, wird der bestehende Baum an das neue HTML angeglichen.
 * Elemente bleiben dadurch erhalten, und CSS-Übergänge (Schalter, Chips, Ringe, Balken, Bubbles) laufen weich. */

let inserted = null;
const keyOf = (n) => (n.nodeType === 1 ? n.getAttribute('data-key') : null);

function morphChildren(parent, next) {
  let keyed = null;
  for (let c = parent.firstChild; c; c = c.nextSibling) {
    const k = keyOf(c);
    if (k) (keyed || (keyed = new Map())).set(k, c);
  }
  let cur = parent.firstChild;
  let n = next.firstChild;
  while (n) {
    const following = n.nextSibling;
    const k = keyOf(n);
    let match = null;
    if (k) {
      const cand = keyed && keyed.get(k);
      if (cand && cand.tagName === n.tagName) {
        match = cand;
        keyed.delete(k);
      }
    } else if (cur && cur.nodeType === n.nodeType && !keyOf(cur) && (n.nodeType !== 1 || cur.tagName === n.tagName)) {
      match = cur;
    }
    if (match) {
      if (match === cur) cur = cur.nextSibling;
      else parent.insertBefore(match, cur);
      morphNode(match, n);
    } else {
      parent.insertBefore(n, cur);
      if (inserted && n.nodeType === 1) inserted.push(n);
    }
    n = following;
  }
  while (cur) {
    const nx = cur.nextSibling;
    parent.removeChild(cur);
    cur = nx;
  }
}

function morphNode(a, b) {
  if (a.nodeType !== 1) {
    if (a.nodeValue !== b.nodeValue) a.nodeValue = b.nodeValue;
    return;
  }
  const num0 = a.getAttribute('data-num');
  const aa = a.attributes;
  for (let i = aa.length - 1; i >= 0; i--) if (!b.hasAttribute(aa[i].name)) a.removeAttribute(aa[i].name);
  const ba = b.attributes;
  for (let i = 0; i < ba.length; i++) if (a.getAttribute(ba[i].name) !== ba[i].value) a.setAttribute(ba[i].name, ba[i].value);
  if (a.tagName === 'INPUT') return;
  morphChildren(a, b);
  const num1 = a.getAttribute('data-num');
  if (num0 !== null && num1 !== null && num0 !== num1) tweenNumber(a, +num0, +num1);
}

function morphInto(root, html) {
  const tpl = document.createElement('template');
  tpl.innerHTML = html;
  inserted = [];
  morphChildren(root, tpl.content);
  const list = inserted;
  inserted = null;
  // wenige neue Zeilen blenden weich ein; bei großen Listenwechseln würde das nur flackern
  if (list.length && list.length <= 10) list.forEach((el) => el.matches('.row, .card') && el.classList.add('m-in'));
}

/** Beträge zählen weich vom alten zum neuen Wert. */
const tweens = new WeakMap();
function tweenNumber(el, from, to) {
  if (reduceMotion()) return;
  const token = {};
  tweens.set(el, token);
  const t0 = performance.now();
  const step = (now) => {
    if (tweens.get(el) !== token || !el.isConnected) return;
    const t = clamp((now - t0) / 650, 0, 1);
    const e = 1 - Math.pow(1 - t, 4);
    el.textContent = eur(t >= 1 ? to : from + (to - from) * e);
    if (t < 1) requestAnimationFrame(step);
  };
  step(t0);
}

function fadeIn(el, dy) {
  if (reduceMotion() || !el.animate) return;
  el.animate([{ opacity: 0, transform: 'translateY(' + (dy === undefined ? 12 : dy) + 'px)' }, { opacity: 1, transform: 'none' }], { duration: 380, easing: EASE });
}

/* ---------- Hauptansicht ---------- */

function mountMain() {
  $main.innerHTML = '<div id="head"></div><div id="viewwrap"><div class="view" id="view"></div></div>' + bottomBarHTML();
  $head = document.getElementById('head');
  $view = document.getElementById('view');
}

/** Wechsel zwischen Ansichten: die alte gleitet als Kopie hinaus, die neue hinein. */
function transitionMain(html, fromKey, toKey) {
  const wrap = $view.parentNode;
  wrap.querySelectorAll('.view-ghost').forEach((g) => g.remove());
  if ($view.getAnimations) $view.getAnimations().forEach((a) => a.cancel());
  if (reduceMotion() || !$view.animate) {
    $view.innerHTML = html;
    $view.scrollTop = 0;
    return;
  }
  const ghost = $view.cloneNode(true);
  ghost.removeAttribute('id');
  ghost.classList.add('view-ghost');
  ghost.setAttribute('aria-hidden', 'true');
  const top = $view.scrollTop;
  const sc = saveScroll($view);
  wrap.insertBefore(ghost, $view);
  ghost.scrollTop = top;
  restoreScroll(ghost, sc);
  $view.innerHTML = html;
  $view.scrollTop = 0;

  const fromTab = fromKey.split(':')[0];
  const toTab = toKey.split(':')[0];
  let out;
  let inn;
  let dur = 460;
  if (fromTab !== toTab) {
    const dir = TAB_ORDER[toTab] > TAB_ORDER[fromTab] ? 1 : -1;
    out = [{ transform: 'translateX(0)', opacity: 1 }, { transform: 'translateX(' + -dir * 28 + '%)', opacity: 0 }];
    inn = [{ transform: 'translateX(' + dir * 100 + '%)' }, { transform: 'translateX(0)' }];
  } else if (fromKey === toKey) {
    out = [{ opacity: 1 }, { opacity: 0 }];
    inn = [{ opacity: 0 }, { opacity: 1 }];
    dur = 360;
  } else {
    const deeper = /:(all|overview)$/.test(fromKey);
    out = deeper ? [{ opacity: 1, transform: 'scale(1)' }, { opacity: 0, transform: 'scale(.955)' }] : [{ opacity: 1, transform: 'translateY(0)' }, { opacity: 0, transform: 'translateY(34px)' }];
    inn = deeper ? [{ opacity: 0, transform: 'translateY(34px)' }, { opacity: 1, transform: 'translateY(0)' }] : [{ opacity: 0, transform: 'scale(.955)' }, { opacity: 1, transform: 'scale(1)' }];
    dur = 400;
  }
  const done = () => ghost.remove();
  const ga = ghost.animate(out, { duration: dur * 0.8, easing: EASE, fill: 'forwards' });
  ga.onfinish = done;
  ga.oncancel = done;
  $view.animate(inn, { duration: dur, easing: EASE });
}

function renderMain() {
  const head = headerHTML();
  if (head !== cache.head) {
    if (cache.head === null) $head.innerHTML = head;
    else morphInto($head, head);
    cache.head = head;
  }
  const key = mainViewKey();
  const body = viewMain();
  if (cache.key === null) $view.innerHTML = body;
  else if (key !== cache.key || cache.force) transitionMain(body, cache.key, key);
  else if (body !== cache.body) morphInto($view, body);
  cache.key = key;
  cache.body = body;
  cache.force = false;
  syncCharts($view);
}

/* ---------- Sheets ---------- */

function hydrate(root, sheet) {
  root.querySelectorAll('[data-f]').forEach((inp) => {
    const v = sheet.p[inp.dataset.f] || '';
    if (inp.value !== v) inp.value = v;
  });
}

function sheetNode(sheet) {
  return $sheets.querySelector('.sheet[data-key="' + sheet.key + '"]');
}

function renderSheetNode(sheet, node) {
  const def = SHEETS[sheet.type];
  const body = def.html.call(def, sheet.p, sheet);
  const bottom = def.bottom ? def.bottom.call(def, sheet.p, sheet) : '';
  const vk = def.viewKey ? def.viewKey(sheet.p) : '';
  const $body = node.children[1];
  const $foot = node.children[2];
  const first = node._body === undefined;
  const switched = !first && node._vk !== vk;
  if (node._body !== body) {
    if (first) $body.innerHTML = body;
    else if (switched) {
      $body.innerHTML = body;
      $body.scrollTop = 0;
      fadeIn($body);
    } else morphInto($body, body);
    node._body = body;
    hydrate($body, sheet);
  }
  if (node._bottom !== bottom) {
    if (first) $foot.innerHTML = bottom;
    else if (switched) {
      $foot.innerHTML = bottom;
      fadeIn($foot, 0);
    } else morphInto($foot, bottom);
    $foot.hidden = !bottom;
    node._bottom = bottom;
    hydrate($foot, sheet);
  }
  node._vk = vk;
  syncCharts($body);
}

function renderSheets() {
  const keys = new Set(ui.sheets.map((s) => String(s.key)));
  Array.from($sheets.children).forEach((node) => {
    if (!keys.has(node.dataset.key) && !node.classList.contains('leave')) {
      node.classList.add('leave');
      node.classList.remove('under');
      node.style.transform = '';
      setTimeout(() => node.remove(), 520);
    }
  });
  ui.sheets.forEach((sheet, i) => {
    let node = sheetNode(sheet);
    if (!node) {
      node = document.createElement('section');
      node.className = 'sheet enter';
      node.dataset.key = sheet.key;
      node.dataset.type = sheet.type;
      node.innerHTML = '<div class="sheet-handle" data-a="close"><i></i></div><div class="sheet-scroll"></div><div class="sheet-bottom"></div>';
      $sheets.appendChild(node);
      void node.offsetHeight;
      requestAnimationFrame(() => node.classList.remove('enter'));
    }
    node.classList.toggle('under', i < ui.sheets.length - 1);
    renderSheetNode(sheet, node);
  });
  // die Ebene darunter tritt zurück, solange ein Sheet offen ist
  $main.classList.toggle('behind', ui.sheets.length > 0);
}

function render() {
  renderMain();
  renderSheets();
  const note = document.getElementById('note-seed');
  if (note) note.textContent = 'Seed ' + S.seed;
}

function openSheet(type, p) {
  const sheet = { key: ++sheetSeq, type, p: p || {} };
  ui.sheets.push(sheet);
  render();
  return sheet;
}
function closeSheet(sheet) {
  sheet = sheet || ui.sheets[ui.sheets.length - 1];
  if (!sheet) return;
  ui.sheets = ui.sheets.filter((s) => s !== sheet);
  render();
}
function closeSheetsOfType(type) {
  ui.sheets = ui.sheets.filter((s) => s.type !== type);
}

let toastTimer = null;
function toast(msg) {
  $toast.textContent = msg;
  $toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $toast.classList.remove('show'), 2600);
}
